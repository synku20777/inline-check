<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Form Validation</title>
  <link href="index.css" rel="stylesheet">
</head>

<body>
  <h1>Registration</h1>
  <form id="registrationForm"><label for="name">Name</label><input type="text" id="name">
    <p id="nameError"></p><label for="email">Email</label><input type="text" id="email">
    <p id="emailError"></p><label for="password">Password</label><input type="password" id="password">
    <p id="passwordError"></p><label for="confirmPassword">Confirm password</label><input type="password"
      id="confirmPassword">
    <p id="confirmPasswordError"></p><button type="submit">Submit</button>
  </form>
  <p id="successMessage"></p>
  <script src="script.js"></script>
</body>

</html>
